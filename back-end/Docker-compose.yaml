version: '3'
services:
  back-end:
    build: 
      context: .
    env_file: .env.docker

    ports:
      - "8000:8000"
    environment:
        SECRET_KEY: "${SECRET_KEY}"
    depends_on:
      - db

  db:
    image : mysql:8.0
    env_file: .env.docker
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
